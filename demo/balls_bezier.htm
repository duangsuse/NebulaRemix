<body style=margin:0;background:#111;overflow:hidden;cursor:crosshair;touch-action:none;><canvas tabindex=0 id=v></canvas>
<script>
document.title="Press H (BasicPhy Lab)"
let c=document.getElementById('v'), g=c.getContext('2d'), W=innerWidth, H=innerHeight
let mode='D', XX=0b10, pts=[], balls=[], sel=null, drag=null, m={x:0,y:0}
let resize=()=>{c.width=W=innerWidth;c.height=H=innerHeight}
window.onresize=resize; resize()

// --- Logic: Init ---
let
  rand = (min,max) => Math.random()*(max-min)+min,
  lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}),
  dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y)
let reset = () => {
  let ry = (v) => v + (Math.random()-0.5)*200 // Y轴随机扰动
  // 随机下凹：两头高，中间低
  pts = [{x:W*0.2,y:ry(H*0.4)}, {x:W*0.5,y:Math.min(H-50, ry(H*0.8))}, {x:W*0.8,y:ry(H*0.4)}]
  balls = mode=='D' ? [{x:W/2, y:50, vx:0, vy:0, r:15}] : []
  drag = null

  reset = (n = 12, v = 0, brk=2) => {
    let y = H / 2, R = () => Math.random() - 0.5 // 注入高频"微扰动"（Ruggedness Jitter）（越陡的地方越容易产生次级破碎） [-0.5, 0.5)

    pts = Array.from({length: n}, (_, i) => {
      v = (v + R() * 150) * 0.8                          // 1. 惯性游走 (决定宏观的连绵起伏)
      y = Math.max(80, Math.min(H - 80, y + v + R()*(50+brk*Math.abs(v)))) // 2. 叠加微观崎岖，并限制在屏幕内
      return lerp({x: W * 0.05, y}, {x: W * 0.95, y}, i / (n - 1)) // 3. 优雅利用 lerp 分布 X 轴
    })

    balls = mode == 'D' ? [{x: W / 2 + R() * W * 0.4, y: 50, vx: R() * 5, vy: 0, r: 15}] : []
    drag = null
  }

}, start,raf
reset()

// --- Math Kernels ---
let lagrange = (tx) => pts.reduce((a,p,i)=>a+p.y*pts.reduce((k,q,j)=>i==j?k:k*(tx-q.x)/(p.x-q.x),1),0)
let bspline = (p0,p1,p2,p3,t) => { // 均匀三次B样条矩阵展开
  let v=(a,b,c,d)=>(a*(1-t)**3 + b*(3*t**3-6*t**2+4) + c*(-3*t**3+3*t**2+3*t+1) + d*t**3)/6
  return {x:v(p0.x,p1.x,p2.x,p3.x), y:v(p0.y,p1.y,p2.y,p3.y)}
}
let catmull = (p0,p1,p2,p3,t) => { // 保证曲线穿过所有控制点，比 Lagrange 更平滑且局部修改不影响全局。
  let v=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t)
  return {x:v(p0.x,p1.x,p2.x,p3.x), y:v(p0.y,p1.y,p2.y,p3.y)}
}

let bez = (ps, t) => ps.length==1?ps[0]:bez(ps.slice(0,-1).map((p,i)=>lerp(p,ps[i+1],t)),t)
let bezTan = (ps, t) => { // f(t+e)-f(t-e)
  let e=0.001, a=bez(ps,Math.max(0,t-e)), b=bez(ps,Math.min(1,t+e))
  return {x:b.x-a.x, y:b.y-a.y}
}

// --- Physics (Multi-Ball) ---
let gx=0, gy=0.5, notKbd=navigator.maxTouchPoints
if(notKbd) window.ondeviceorientation=e=>{ gx=e.gamma/45; gy=e.beta/45 } // gamma 左右滚，beta 前后倾

let closestT = (p, ps) => {
  let minD=Infinity, bestT=0, scans=40
  for(let i=0; i<=scans; i++) { let t=i/scans, d=dist(p, bez(ps,t)); if(d<minD){minD=d;bestT=t} }
  let l=Math.max(0,bestT-0.02), h=Math.min(1,bestT+0.02)
  for(let i=0; i<6; i++) {
    let t1=(l*2+h)/3, t2=(l+h*2)/3
    if(dist(p,bez(ps,t1)) < dist(p,bez(ps,t2))) h=t2; else l=t1
  }
  return (l+h)/2
}
let solve = (dt) => {

  // ---> 插入在这里：先处理球间碰撞 <---
  balls.forEach((b1, i) => balls.slice(i + 1).forEach(b2 => {
    let dx=b2.x-b1.x, dy=b2.y-b1.y, d=Math.hypot(dx,dy), md=b1.r+b2.r
    if(d < md && d > 0.01) { 
      let nx=dx/d, ny=dy/d, p=(md-d)/2, vn=(b1.vx-b2.vx)*nx+(b1.vy-b2.vy)*ny
      b1.x-=nx*p; b1.y-=ny*p; b2.x+=nx*p; b2.y+=ny*p 
      if(vn < 0) { let b=-vn*0.8; b1.vx+=nx*b; b1.vy+=ny*b; b2.vx-=nx*b; b2.vy-=ny*b } 
    }
  }))

  
  balls.forEach(b => {
    b.vx+=gx*dt; b.vy+=gy*dt; // G=10N/kg
    b.x+=b.vx*dt; b.y+=b.vy*dt
    
    if(pts.length>1) {
      let t=closestT(b, pts), ground=bez(pts, t), d=dist(b, ground)
      if(d < b.r) { //^v 碰撞响应: 分离法线（Normal）和切线（Tangent）方向的向量。法线方向处理反弹，切线方向加入摩擦/滚动阻力
        let tan=bezTan(pts, t), m=Math.hypot(tan.x, tan.y), tx=tan.x/m, ty=tan.y/m
        let nx=-ty, ny=tx
        if((b.x-ground.x)*nx + (b.y-ground.y)*ny < 0) { nx=-nx; ny=-ny; tx=-tx; ty=-ty }
        
        b.x += nx*(b.r-d); b.y += ny*(b.r-d) // Resolve Pen
        let vn=b.vx*nx+b.vy*ny, vt=b.vx*tx+b.vy*ty
        if(vn<0) vn *= (vn<-1.0?-0.6:0); 
        vt *= 0.999 // 降低阻尼 (Rolling Resistance)
        b.vx = vn*nx + vt*tx; b.vy = vn*ny + vt*ty
      }
    }
    // Bounds
    if(b.y>H-b.r){b.y=H-b.r;b.vy*=-0.6}
    if(b.x<b.r||b.x>W-b.r) b.vx*=-0.6
  })

}

// --- Interaction ---
c.onpointerup = () => {drag = sel = null; c.focus()}
c.onpointerdown = e => {
  e.preventDefault()
  m={x:e.clientX, y:e.clientY}
  if(e.button==1) return reset() // Mid: Reset Random
  if(e.button==2) { pts.push({...m}); pts.sort((a,b)=>a.x-b.x); return } // Right: Add + Sort X
  
  let hitB = balls.find(b=>dist(m,b)<b.r+50)
  let hitP = pts.find(p=>dist(m,p)<30)
  drag = hitB || hitP
  if(drag && !drag.r) sel=drag
}
c.onpointermove = e => {
  m={x:e.clientX, y:e.clientY}
  if(!drag) return
  let old={x:drag.x, y:drag.y}
  drag.x=m.x; drag.y=m.y
  if(drag.r) { drag.vx=drag.x-old.x; drag.vy=drag.y-old.y }
}
c.onkeyup = e => {
  if(e.key=='h') start(mode=(prompt('Mode:\nA: Lagrange\nB: Bezier (Key S -> cont)\nC: Catmull\n\nE:B-Spline\nD: Collision (D -> +Ball)\nD:Toggle Normal')||'D').toUpperCase()[0])
  if(e.key=='s') pts.push({...m}) // S: Add (No Sort)
  if(e.key=='d' && mode=='D') balls.push({x:m.x, y:m.y, vx:rand(-5,5), vy:rand(-5,5), r:rand(10,20)}) // Space: Spawn
}
onclick=()=>{if(notKbd) c.onkeyup({key:(XX&2**1)?'d':'s'})}
oncontextmenu = e => {e.preventDefault(); if(notKbd) c.onkeyup({key:'h'})}

// --- Loops ---
let drawPts = () => pts.forEach(p=>{
  g.fillStyle=p==sel?'#fff':'#0f8'; g.beginPath(); g.arc(p.x,p.y,4,0,7); g.fill()
  g.fillStyle='#555'; g.fillText(`(${p.x|0},${p.y|0})`,p.x+8,p.y-8)
})

let loopStd = () => {
  g.fillStyle='rgba(17,17,17,0.2)'; g.fillRect(0,0,W,H)
  if(pts.length>1) {
    g.strokeStyle='#0f8'; g.lineWidth=2; g.beginPath()
    if(mode=='A') for(let tx=0;tx<W;tx+=4) g.lineTo(tx, lagrange(tx))
    if(mode=='B') for(let t=0;t<=1;t+=0.01) { let p=bez(pts,t); t==0?g.moveTo(p.x,p.y):g.lineTo(p.x,p.y) }
    if(mode=='C') for(let i=0;i<pts.length-1;i++) {
      let p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2
      for(let t=0;t<=1;t+=0.05) { let p=catmull(p0,p1,p2,p3,t); t==0&&i==0?g.moveTo(p.x,p.y):g.lineTo(p.x,p.y) }
    }
    if(mode=='E') for(let i=0;i<pts.length-1;i++) for(let t=0;t<=1;t+=0.05) { let p=bspline(pts[i-1]||pts[i],pts[i],pts[i+1],pts[i+2]||pts[i+1],t); t==0&&i==0?g.moveTo(p.x,p.y):g.lineTo(p.x,p.y) }
    g.stroke()
  }
  drawPts(); raf=requestAnimationFrame(loopStd)
}

let loopPhy = () => {
  g.fillStyle='#111'; g.fillRect(0,0,W,H)
  if(pts.length>1) {
    g.strokeStyle='#333'; g.lineWidth=1; g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke()
    g.strokeStyle='#0f8'; g.lineWidth=3; g.beginPath()
    for(let t=0;t<=1;t+=0.01) { let p=bez(pts,t); t==0?g.moveTo(p.x,p.y):g.lineTo(p.x,p.y) }
    // 法线可视化：在曲线上等距采样并绘制垂直线
    if(XX&2**1) for(let t=0;t<=1;t+=0.02){ let p=bez(pts,t), tn=bezTan(pts,t), l=Math.hypot(tn.x,tn.y); g.moveTo(p.x,p.y); g.lineTo(p.x-tn.y/l*15, p.y+tn.x/l*15) }
    g.stroke()
  }
  if(!drag || pts.includes(drag)) { let s, sub=8; for(s=0; s<sub; s++) solve(1/sub) }
  drawPts()
  balls.forEach(b => { g.fillStyle='#f05'; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fill() })
  raf=requestAnimationFrame(loopPhy)
}

(start=()=>{if(raf) cancelAnimationFrame(raf); mode=='D' ? loopPhy(XX^=2**1) : loopStd()})()
</script></body>
