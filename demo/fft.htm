// FFT Logic
let dft = (p) => {
  let N = p.length, res = []
  for (let k=0; k<N; k++) {
    let re=0, im=0
    for (let n=0; n<N; n++) {
      let phi = (Math.PI*2*k*n)/N
      re += p[n].x * Math.cos(phi) + p[n].y * Math.sin(phi)
      im += -p[n].x * Math.sin(phi) + p[n].y * Math.cos(phi)
    }
    let freq = k > N/2 ? k - N : k 
    res.push({re: re/N, im: im/N, freq: freq, amp: Math.hypot(re,im)/N, phase: Math.atan2(im,re)})
  }
  return res.sort((a,b) => b.amp - a.amp)
}

let parse = (d) => {
  el_path.setAttribute('d', d)
  let len = el_path.getTotalLength(), pts = [], cx=0, cy=0
  for (let i=0; i<len; i+=2) { 
    let p = el_path.getPointAtLength(i)
    pts.push({x: p.x*3, y: p.y*3}); cx+=p.x*3; cy+=p.y*3
  }
  cx /= pts.length; cy /= pts.length
  return pts.map(p => ({x: p.x - cx, y: p.y - cy}))
}


window.load = (data) => {
  state='view'; path = typeof data === 'string' ? parse(data) : data

let loop = () => {
  // Always Clear (Fixes Double Arm Ghosting)
  x.clearRect(0,0,w,h)

  if (state == 'draw') {
    x.strokeStyle='#0f8'; x.lineWidth=3; x.beginPath()
    if(path.length) { x.moveTo(path[0].x+w/2, path[0].y+h/2); path.forEach(p=>x.lineTo(p.x+w/2, p.y+h/2)) }
    x.stroke(); requestAnimationFrame(loop); return
  }
  
  x.translate(w/2, h/2)
  let active = coeffs.slice(0, cfg.n_iter)
  
  if (active.length) {
    let px=0, py=0
    active.forEach(c => {
      let prev = {px, py}
      let phi = c.freq * t + c.phase
      px += c.amp * Math.cos(phi); py += c.amp * Math.sin(phi)
      
      // Arms (Always Sharp)
      if(cfg.epicyc){
        x.strokeStyle='rgba(255,255,255,0.15)'; x.lineWidth=1; 
        x.beginPath(); x.arc(prev.px, prev.py, c.amp, 0, 7); x.stroke() // Circle
        x.beginPath(); x.moveTo(prev.px, prev.py); x.lineTo(px, py); x.stroke() // Line
      }
    })

    // Wave (Controlled by Trails)
    if (cfg.trails) {
      wave.unshift({x: px, y: py}); if(wave.length > Math.max(1000, coeffs.length)) wave.pop()
      x.beginPath(); x.strokeStyle='#0f8'; x.lineWidth=2
      wave.forEach((p,i)=> i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)); x.stroke()
    } else {
      // If trails off, just draw the tip
      x.fillStyle='#0f8'; x.beginPath(); x.arc(px, py, 3, 0, 7); x.fill()
    }
    
    t += (Math.PI*2) / Math.max(coeffs.length, 200)// * cfg.speed
  }
  
  x.setTransform(1,0,0,1,0,0); //requestAnimationFrame(loop)
}

// NOTE 该示例是为了epicycles准备的，所以它需要尽量的“一笔画”。现在的数据会导致振铃效应
// 核心逻辑：自动解析 CSS、提取 WOFF2、解析矢量、推入动画
async function quickText(text) {
  const
    T = Typr, {U}=T, {default:C}=await import('https://esm.sh/paper'?? 'https://esm.sh/clipper-lib'), 
    //css = await (await fetch(cfg.woff.replace('https://fonts.google.com/share?selection.family=', 'https://fonts.googleapis.com/css2?family='))).text(),
    // 1. 从配置中提取 family 名称 (例如 "Caveat+Brush")
    family = new URLSearchParams(cfg.woff.split('?')[1]).get('selection.family') ?? (cfg.woff||'Charm'),
    // 2. 转换名称格式用于路径 (例如 "caveatbrush")
    slug = s=>s.replace(/[\+\s]/g, ''),
    // 3. 拼装 TTF 直链 (TTF 不需要 pako 解压，Typr 直接解析)
    fontUrl = /\.ttf$/.test(cfg.woff)? cfg.woff : `https://raw.githubusercontent.com/google/fonts/refs/heads/main/ofl/${slug(family).toLowerCase()}/${slug(family)}-Regular.ttf`
  const
    font = T.parse(await (await fetch(fontUrl)).arrayBuffer())[0],
    shape = U.shapeToPath(font, U.shape(font, text, 0)),
    s = 80 / font.head.unitsPerEm; // 1em 布局文字
  shape.crds.forEach((v, i, a) => a[i] = i % 2 ? -v * s + 65 : v * s + 30)
  if(!cfg.epicyc){
    C.setup(c);window.paper=C
    shape.crds = pathContours(shape.crds);
  }
  return U.pathToSVG(shape); // 转换并加载
}

// Text Processing: Render -> Edge Detect -> Sort (Nearest Neighbor)
let textToPath = async (txt) => {
  let tc = document.createElement('canvas'), tx = tc.getContext('2d')
  if (/^data:image|http/.test(txt)) {
    let img = new Image()
    img.src = txt
    await img.decode() // 既然支持 then，直接 await 即可，不玩 Promise 包装
    tc.width = img.width; tc.height = img.height
    tx.drawImage(img, 0, 0)
  } else {
    tc.width = 400; tc.height = 200
    tx.font = 'bold 120px Arial'; tx.fillStyle = 'white'; tx.textAlign = 'center'; tx.textBaseline = 'middle'
    tx.fillText(txt, 200, 100)
  }
  let { width: w, height: h } = tc
  let id = tx.getImageData(0, 0, w, h).data, pts = []
  let offX = w / 2, offY = h / 2

  for (let y = 1; y < h - 1; y += 2) {
    for (let x = 1; x < w - 1; x += 2) {
      let i = (y * w + x) * 4
      if (id[i + 3] > 128 || id[i] > 128) { // 检查 Alpha 或亮度
        // 只要四周有一个像素是空的，它就是边缘点
        let isEdge = id[i - 4] < 128 || id[i + 4] < 128 || id[i - w * 4] < 128 || id[i + w * 4] < 128
        if (isEdge) pts.push({ x: x - offX, y: y - offY, used: false })
      }
    }
  }

  // Greedy Sort to minimize jump distance (TSP approx)
  // 3. 贪婪排序 (最近邻搜索)
  if (!pts.length) return []
  let sorted = [], curr = pts[0]
  curr.used = true
  sorted.push(curr)

  for (let i = 1; i < pts.length; i++) {
    let minD = Infinity, next = null
    // Search window optimization: only check recent 500 or all if small
    for (let p of pts) {
      if (p.used) continue
      let d = (p.x - curr.x) ** 2 + (p.y - curr.y) ** 2
      if (d < minD) { 
        minD = d; next = p
        if (d < 5) break // 足够近了，直接收工去下一个
      }
    }
    if (next) {
      next.used = true; sorted.push(next); curr = next
    } else break
  }

  return sorted
}

//是一个旅行商问题 (TSP, Traveling Salesperson Problem)：你需要将这些杂乱的 (x,y) 点重新排序，使得点与点之间的连线距离最短，从而让“画笔”以最合理的路径游走，消除长距离的跨越。
window.pathContours = (a, options = {}) =>{
    const {
        smoothFactor = 0.1,   // 平滑强度
        resolution = 2000        // 每段插值点数
    } = options;
    
    const points = [];
    for (let i = 0; i < a.length; i += 2) {
        points.push(new paper.Point(a[i], a[i + 1]));
    }
    
    const path = new paper.Path(points);
    path.smooth({ type: 'continuous', factor: smoothFactor });
    
    // 沿曲线插值生成更多点
    const result = [];
    const totalLength = path.length;
    const step = totalLength / resolution;
    
    for (let offset = 0; offset <= totalLength; offset += step) {
        const point = path.getPointAt(offset);
        if (point) result.push(point.x, point.y);
    }
    
    path.remove();
    return result
}
</script>
