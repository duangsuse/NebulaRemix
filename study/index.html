# 看见看不见的波动：交互式探索高斯平滑 (Gaussian Smoothing)

> 作者：[duangsuse](https://t.me/dsuse) ，[（目录在这里）](#toc)

在计算机视觉、信号处理乃至金融分析中，有一个听起来很高深但实际上无处不在的概念——**卷积（Convolution）与平滑（MA20、MA60）**。

古法教程只会给你扔几个公式，或者展示几张模糊的照片。但在AI辅助创作的本文中，我们采用不同的方式（砸字数掰开揉碎的方式）。

请看向文章顶部的 **“实时信号实验室”** 面板。那不仅仅是一个动画，它是一个运行在你浏览器里的简易信号处理工作站。

我们将分三个章节，解构你所看到的画面。

---

## 第一节：场景与直觉 —— 为什么我们需要“模糊”世界？

### 1.1 理想与现实的差距

请在顶部的实验室中，将左上角的 `Signal Type` 下拉菜单切换为 **"Square (方波)"**。

仔细观察那条**灰色的线（Raw Signal）**。它代表了理想世界中的信号：状态在 `1` 和 `-1` 之间瞬间切换，边缘锋利，毫不拖泥带水。这就像是一个完美的数字开关，或者理想中的股票买卖点。

然而，在现实的物理世界中，无论是温度传感器的读数、麦克风录入的声音，还是摄像头捕捉的光子，都充满了**噪声（Noise）和抖动**。如果我们在自动驾驶汽车中，仅仅因为传感器接收到了一个毫秒级的电压尖峰（Spike），就判断前方有障碍物并猛踩刹车，那将是灾难性的。

### 1.2 “平滑”即“信任”

我们需要一种机制，告诉计算机：“不要相信某一个孤立的时间点，要相信**一段时间内的趋势**。”

这就是**平滑**的本质。

请在实验室中移动鼠标。

* **X轴移动**：控制“平滑力度”（卷积核大小）。
* **Y轴移动**：控制信号的频率（波动的快慢）。

看那条**绿色的线（Convolved Signal）**。当你把鼠标向右移动（增大核的大小），你会发现绿色线条不再像灰色线条那样棱角分明。它变得圆润、迟缓。

* **方波的棱角**被磨平了。
* **锯齿波（Sawtooth）的尖刺**变得柔和。

这看似是一种“降级”或“模糊”，但在工程上，这是至关重要的 **去噪（Denoising）过程**。通过牺牲一点点反应速度和细节，我们获得了一条更稳定、更可预测的数据流。

## 第二节：数学核心 —— 那个“绿色的透镜”是什么？

现在，我们要揭开魔法的盖子。请将目光集中在鼠标指针所在的位置。你会看到一排绿色的柱状条，它们组成了一个钟形的曲线。

### 2.1 卷积核 (The Kernel)

这个跟随鼠标移动的绿色钟形结构，被称为**卷积核（Kernel）**，或者在很多文献中被称为“窗口”、“算子”。

想象你拿着一个放大镜在读一行字。你看到的不是整本书，而是透过镜片的一小部分区域。

* **Kernel Size (鼠标X轴)**：决定了透镜有多宽。
* **Kernel Shape**：决定了透镜的折射率分布。

在我们的例子中，这个形状是著名的**高斯分布（Gaussian Distribution）**，其数学表达为： N（μ ,σ2） here N=正态分布

别被公式吓跑。看屏幕上的绿色柱子：**中间最高，两边逐渐降低。** 这就是高斯分布的全部物理含义：**离我越近的邻居，投票权越大；离我越远的，投票权越小。**

> TIPS: 透过镜片的一小部分区域…… 你真的在拿手机读本文？试试Ctrl一下 W AVE右边那玩意  ：）

### 2.2 卷积运算 (The Operation)

所谓的“卷积”，就是让这个“绿色透镜”从左到右扫过整条灰色信号线。

在这个交互组件的后台（也就是刚才优化的代码中），每一帧都在进行数万次这样的计算：

```javascript
// 伪代码逻辑
result[i] = ( signal[i-2] * 0.05 ) + 
            ( signal[i-1] * 0.20 ) + 
            ( signal[i]   * 0.50 ) + // 自己权重最大
            ( signal[i+1] * 0.20 ) + 
            ( signal[i+2] * 0.05 );

```

每一个绿色的像素点（输出），都是原始灰色信号及其周围邻居的**加权平均值**。

熟悉列表处理的你，肯定能看出来 off-by-one 的边界条件： i=0 时 a[i-1] 是错误，所以窗口会进行预填充0（或顺延a[0],a[-1]），i会从核大小/2开始。

如果还不懂什么是边界条件，你可能该向AI学学无循环怎么编程了（尾递归或broadcast）。循环的基线条件很含糊，导致你看不清i越界了。这和觉得 for if push 比 [1,2].map(..+1) 快一样，是个坏习惯。

[看这里！如果你还不习惯画布与yx坐标系。但是 CSS.px top left 怎么一起算应该都会了](https://t.me/dsuse/19405)

### 2.3 交互实验：理解 Sigma

现在，请尝试以下操作：

1. 选择 **"Sawtooth (锯齿函数)"**。
2. 将鼠标慢慢向左移动到最边缘。
* **现象**：绿色的核变得非常窄，像一根针。
* **结果**：绿线（输出）几乎完美重合了灰线（输入）。
* **原理**：小时候，我们只听自己的，不听邻居的。没有平滑发生。


3. 将鼠标慢慢向右移动。
* **现象**：绿色的核变宽变矮。
* **结果**：方波逐渐变成了类似**正弦波（Sine Wave）**的形状。
* **原理**：长大了，我们听取了太多邻居的意见，导致自身的特征被淹没。锯齿的高频边缘（剧烈变化的部分）被彻底抹杀，只留下了低频的基础轮廓。这就是为什么高斯平滑也被称为**低通滤波器（Low-pass Filter）**。

## 第三节：降维打击 —— 从 1D 到 2D 的炫迈(Stride)

虽然我们的实验室展示的是 1D 信号（像音频波形或股票曲线），但这个原理是通用的。理解了上面的 1D 演示，你就理解了 Photoshop 里 90% 的滤镜原理。

### 3.1 1D 信号的应用（时间序列）

* **音频处理**：去过演唱会吗？录像背景里那种“嘶嘶”的电流声通常是高频噪声。通过一个类似的高斯平滑（低通滤波LPF），可以把毛刺滤掉，虽然声音会变得稍显沉闷（Lost Clarity），但更纯净。
* **金融量化**：股票K线图中的 `MA20`、`MA60` 均线，本质上就是一种平滑。只不过它们通常用的是“均匀核”（Box Kernel，所有邻居权重一样），而高斯核赋予近期价格更高的权重，对趋势转折更敏感。

### 3.2 2D 信号的应用（图像处理）

如果我们将这个逻辑扩展到二维，原本的线条变成了图片，原本的一维数组变成了二维矩阵。

* **高斯模糊 (Gaussian Blur)**：
想象那个绿色的钟形曲线不再是扁平的，而是一个立体的“小山包”。我们拿着这个“小山包”在照片的每一个像素上滑动。



这就产生了我们在修图软件中常用的“磨皮”效果。脸上的痘印（也就是图像的mask中的高频噪点，像素值突变区域）被周围健康的肤色“平均”掉了。[你肯定想知道这个——为什么平均脸最美？](https://davemiers.com/the-face-of-tomorrow/)
* **计算机视觉中的边缘检测**：
这是最反直觉的一点：**在寻找边缘之前，我们必须先模糊图像。**
为什么？
请切回实验室的 **"Sawtooth (锯齿波)"**。锯齿上有很多微小的抖动。如果你直接让计算机找“哪里变化最剧烈”，计算机可能会把这些微小的噪点，误认为是边缘。
通过先施加适度的高斯平滑（鼠标移到中间），我们抹去了微小的噪点，只保留了锯齿波那个最大的“跳崖”结构。这时候再做检测，就能精准地捕捉到真正的物体轮廓

那个不波动版本的“锯齿波”——就是锯齿波函数线的变化率和“导速”啊！

---

通过这个简单的 Scriptlet，我们看到的不仅仅是几条跳动的线条，而是数字世界处理信息的基本哲学：

**为了看清大趋势（Trend），有时我们必须学会忽略微小的细节（Noise）。**

高斯平滑不是简单的“把东西变模糊”，它是一种数学上的**选择性关注**，点积，即邻近性注意力。它利用高斯分布的优雅特性，在保留信号核心特征的同时，温和地剔除了那些杂乱无章的干扰。

在信息安全领域，人们经常警告说，模糊处理并不是隐藏图像内容的可靠方法，因为模糊算法(blur, not pix-ify)有不小概率是可逆的。
[模糊是由于邻域重叠产生的，这构成了联立方程组。只要边界条件或可推测，就能像多米诺骨牌一样推导出中间像素。](https://t.me/dsuse/21931)

下次当你在手机上使用“美颜模式”，或者看着自动驾驶汽车平稳过弯时，请记住：在这个平滑的世界背后，正有无数个看不见的“绿色钟形曲线”，在以毫秒级的速度疯狂地进行着卷积运算。

## 第四节：听见平滑 —— 从噪声到音乐 (Karplus-Strong)

如果说高斯模糊是让眼睛“看不清”细节，那么在音频的世界里，平滑则是让耳朵“听不到”刺耳的噪声。

请点击上方组件，触发 **【🔊 Pluck String】** 功能。

你听到那个类似吉他拨弦的声音了吗？这背后并没有存储任何吉他的录音文件，它完全是由仅仅200行代码实时算出来的。这里用到的就是著名的 **Karplus-Strong 算法**，它的核心正是**移动平滑（Moving Average）**。

### 4.1 声音的物理本质

将左上角的 `Signal Type` 下拉菜单切换为 **"noise (白噪音)"**。

当我们拨动一根琴弦时：

1. **初始瞬间**：手指离开琴弦，琴弦处于极度混乱的震动状态。这时候它包含了所有频率，听起来就是一段无调性的**白噪声**（就像组件里最上面的灰色波形）。
2. **震动传播**：这个震动波在琴弦上来回反射。
3. **能量耗散**：这是关键！空气阻力和琴弦内部的摩擦力会吸收能量。但它们不是均匀吸收的，它们更喜欢吸收**高频能量**（剧烈的微小抖动，就像韩红的歌喉）。

保持y轴固定在绿线的零点，点击最左侧，再点击最右侧。

### 4.2 用数学模拟琴弦

在计算机里，我们只需**反复应用滑动平均**来模拟这个“耗散”过程。

[就像这样！！](https://amid.fish/javascript-karplus-strong)

算法逻辑极其简单：

1. 生成一组随机数（模拟初始的白噪声）。
2. 进入循环：取前两个数字，算出**平均值**，再乘个衰减系数（比如 cutoff=0.99），放回队列尾部。

> 你应该能猜出来这并不一定要 `list.push/shift`，也可以是仅仅滑动窗口(RingBuffer)。这种“余数回环”技巧在taskmgr里非常常见！而心电图使用 `line[i++%len]=pnt` 的非队列方法，即黑客最爱的CRT显示。

这里的 `(x_t + x_{t-1}) / 2` 不就是最简单的卷积核 `[0.5, 0.5]` 吗？

因为我们每秒钟都在对波形做上千次这样的“微型平滑”，高频的尖刺（噪声）被迅速磨平，消失殆尽，最后只剩下了平滑起伏的低频波——也就是我们听到的**乐音**。

```py
import numpy as np

# loads() 并分离出一个包含多个 MIDI 键号的向量
mid_keyons = np.array([60, 62, 64, 65, 67, 69, 71, 72]) 

# 没有任何循环，直接进行向量化运算
osc_hz = 440 * (2 ** ((mid_keyons - 69) / 12))
```

**结论：** 管弦音乐，就是被时间“平滑”过后的随机噪声。 所以喜欢合成器的人也不少——殊途同归啊

[import librosa](https://librosa.org/doc/main/auto_examples/plot_chroma.html#chroma-variants) 提供了《卡丽莎·霍布斯 - 我们去钓鱼吧》的音高音色可视化，就像跳动的柱形图。

在第四节的复习中，你会看到对“任何音乐”更有趣的呈现！

## 第五节：看见平滑 —— 图像领域的高斯模糊

现在，让我们把思维从一维的时间线（波形、声音）拉升到二维的空间（图像）。

我们在 Photoshop 或 Instagram 里常用的“高斯模糊（Gaussian Blur）”，本质上就是我们在第一节里做的“绿色透镜”实验，只不过从**一条线**变成了一个**二次方的面**。坐标系不同，“点数”一致，公式可完全相同。

### 5.1 2D 卷积核

![](https://us1.discourse-cdn.com/flex015/uploads/imagej/original/3X/2/e/2ee9a0718144bcceb75d48f7b6a85c371ba8d163.png)

在 1D 实验中，我们的 Kernel 是一个数组。在 2D 图像中，Kernel 变成了一个灰度矩阵（Matrix）。
想象一个中间高、四周低的“小山包”。我们将这个小山包在图片的每一个像素上滑动。

* **当前像素的新颜色** = 周围一圈像素颜色的**加权平均值**。
* 离中心越近的像素，对结果的影响越大（山峰越高）。

![](https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxZYrfxT3muS7DWRjARe_OER8Nu_kEHRNllTs5kdVv7Dfru6Hq)

### 5.2 效果对比：去噪与模糊

![](https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTT1txkXfAYxPAqCpGTJix4S1ihkXTdmNdEJQ&s)

看看上面这张对比图：

* **左图（背景）**：你可以看到很多像沙砾一样的噪点。这些噪点在数学上表现为“像素值的剧烈突变”（RGB三信道上的高频信号）。
* **右图（高斯模糊）**：通过让每个像素都听取周围像素的意见（取平均），那些孤立的、突兀的噪点被同化了。我们只看到五官（近视眼十米以外还会人畜不分哦…… YOLO该不会就是这么预处理再分治的吧？）

### 5.3 为什么是“高斯”？（一个性能伏笔）

你可能会问，为什么一定要用长得像痘痘的2D高斯分布kernel，用平均模糊（均色圆点形状）不行吗？

高斯模糊有一个让程序员感动的数学特性：**可分离性 (Separability)**。

这意味着，要在2D画布上做一个复杂的高斯模糊，我们可以：

1. 先对图像做一次**横向**的 1D 高斯平滑（就像我们在 JS 里做的那样）。
2. 再对结果做一次**纵向**的 1D 高斯平滑。

**结果是完全一样的！** 但计算量大大降低。这就是为什么现在的手机能够实时处理 4K 视频的背景虚化，而不会卡死。

这一优化的基石，依然是我们开篇演示的那个简单的一维卷积，而不需要FFT。

>关于时域卷积的flip问题 (LIFO栈 vs FIFO队 的时序准确性)：

> conv2d 不翻转实现更简单、更快一点，严格数学意义上的卷积，内核是一定要翻转的，翻转后频域定理 F(f * g) = F(f) ⋅ F(g) 才成立。高斯核是中心对称的，Sobel在不翻转（cross-correlation）的情况下，方向才是正确的、直觉的。

经典声音 DSP / 通信 / 控制 / 物理仿真 领域还在背着“必须翻转”的历史包袱，但用上了 huggingface/ONNX，你不会因为这个“大小端问题”而掉坑！！

现代（如 WaveNet , Causal Self-Attention ）流行不翻转用left-padding，就完美实现因果性。从第一性原理看， **常量核翻转无意义，变量核翻转多此一举。**

所以，本就不应该区分，反倒是应该区分出这种【教条主义知识】——凭什么常量是不能【二改】的魔数？

### 5.4 选学:高斯消元与鸡兔同笼

在计算机科学（CS）的视角下，所谓的“高斯消元”根本不是在玩弄什么矩阵变换，它的本质就一句话：解耦（Decoupling）。

【卷积】是把单纯的信息“揉”在一起，制造依赖。消元则是把揉在一起的单项拆开，让每一个 $x_i$ 序号元重新变得“独立”，只和它自己相关！

所谓的“阶梯型”、“增广矩阵”，目的只有一个：找回那个“Eye”（Identity Matrix，阵眼），这时候，x_i​ 就赤裸裸地等于 b_i​。

如果你戴上“线性代数”的透视眼镜，你会发现：FFT 本质上就是对一个特殊矩阵进行了“超光速”的高斯消元分解。

高斯消元：面对一个陌生的矩阵，必须边走边算（动态主元），辛苦地把非对角元素消成 0。
FFT：面对的是老朋友 Frq_y，我们早就知道它的弱点（波对称性）。

我们不需要“计算”消元步骤，我们直接硬编码几个y作桶，硬编码了一套完美多线程的消元方案(Cooley-Tukey FFT)。

> 高斯消元和 FFT 是同理： 它们都在利用正交基的“线性组合”来重塑非线性的（混沌的）信息，即“正交分解”。 

只不过，高斯消元是把一团乱麻理顺成阶梯；而 FFT 是把一根混乱的弹簧（时域）拆解成一个个完美的弹簧（频域）。

这就是编程里最基本的脚本解耦合操作，就像把多项式拆成(+)(*)的步骤，点乘或移项变号。
很多教材会用“行变换”、“增广矩阵” “阶梯型” 这种词把你绕晕。

现在让我们干爆它们。 

这段算法的逻辑，用程序员的人话说只有三步：

- Find the Eye (找主元)：xyz你们谁的权重系数最大，谁就是当下的老大。
- Normalize (归一化)：把老大(i号)的权重强行变成 1，所以其它行的i列同时除，也归1。
- 回代：当前行求和 - 下方已经解出来的未知数造成的干扰

你在代数书里看到的“高斯消元”？其实是一笔糊涂账。为了考试，老师往往把“把矩阵化简”这一动作统称为高斯消元，高斯-约当消元会把最后一步一次性做完，做到eye矩阵（仅'\\'对角线是 1），而不一遍做完性能更好。

Jordan 就是所谓的回代，70%的教材根本是一笔糊涂账，把不一样的语义和功用混为一谈。

现代的 `numpy.linalg.solve` 通过分解上下三角（xyz元的结果vs你消元时的所有除法动作）实现了缓存能力，一旦拆好，之后来任何新的 b，回代就能解出来。 这个牛逼哄哄的算法就是LU分解

**矩阵不仅是数据，它还能是个“动作（Operator）”。** WebXR里就用矩阵做3D游戏。

不过，纯粹的elim也能解初高中无次数方程了，比如，可以正常配平化学分子式，知道H2O咋合成 (`x⋅H2​+y⋅O2​=z⋅H2​O1`)。鸡兔同笼这种伪·应用题更是不算什么。

高斯和LU都有一个硬性要求：方程数必须等于未知数个数 (N=M, 原因见上“i列同时除”)，且矩阵必须满秩（解唯一），在从现实采样的信号里，这种情况其实很少见。想超越符号的话，Least Squares (QR) 和“手工线代之王”SVD可用于拟合传感器，比如 GPS 定位、推荐算法（协同过滤）、图像压缩、特征提取。

比 Sklearn 还要快的 SVD 降维 + SVM 分类器很好写。

没错，它们终究不如纯黑盒的DNN堆算力，点积和高斯、香农熵。

import numpy as np

# 进行高斯消元求 A@x=b, A为x的系数，这里最好有 x=[1 0] x=[0 1]，阶梯式。
def elim(A, b):
  M = np.hstack((A, b.reshape(-1, 1))) # M=(A|常数列b), 横向增，广
  n, m = A.shape; assert n==m, "没有唯一解"

  # 向下找j格最强的行，换为'j'行(即按阶梯排序)
  for j in range(m):
    i=np.argmax(abs(M[j:, j]))+j
    if i!=j: M[[i,j]] = M[[j,i]] #ij=(行ji)
    if (x:=M[j,j])==0: continue
    # j行的主元’x'归一，所以此后的行消x
    M[j] /=  x
    for i in range(j+1, n):
      M[i] -= M[j]*  M[i,j] #x的数量

  # 重新代入
  x = np.zeros(m)
  for j in reversed(range(m)): # x=(解m - 右:数量y*解y的和)/x的数量'1'
    y = np.dot(M[j, j+1:m], x[j+1:])
    x[j] = (M[j,m] - y) / M[j, j]
  return x

#x + y = 35, 2x + 4y = 94
print("鸡兔的解为：", elim(
np.array([[1.]*2, [2.,4]]), np.array([35,94]) ))
```

## 第六节：逆向思维 —— 从求和到求导，再到人工大脑

在前几节中，我们反复封装了一件事：**加权求和（Weighted Sum）**。无论是磨皮模糊还是吉他合成，本质上都是把周围的数据拿来“平均”一下。

这在数学上对应着 **积分（Integration）的思想——通过积累来消除差异**。

科学的积分是牛顿积分（点+速度x帧耗时）或Verlet积分（过去,现在,向量=未来）
所以我们没有通过sympy的化简规则做“符号积分”或“torch对偶数自动微分”而已，而这自然就跳过了“dt无穷小”的抽象地狱。

但，如果我们反其道而行之呢？如果我们不想要“平均”，而是想要找“差异”呢？

### 6.1 边缘检测：对信号的“求导”

请回想第一节中的 **方波（Square Wave）**。方波最显著的特征是什么？是那个从 -1 瞬间跳变为 1 的**垂直边缘**。

在图像处理中，这个“边缘”就是物体的轮廓。如果我们想让计算机自动把物体从背景中抠出来（比如现在的智能抠图、U2Net），我们需要一种专门寻找“跳变”的核，对应那种没有边缘羽化的mask。

这在数学上被称为**求导（Differentiation）**。 你还记得“导速”这个词在哪吗？

经典的 **Sobel 算子** 也是一种卷积核，但它长得和高斯核完全相反：

* **高斯核**：`[1, 2, 1]` （全都是正数，大家一团和气，结果变模糊）
* **Sobel核**：`[-1, 0, 1]` （左边是-1，右边是大1，中间是小零）

想象这个核扫过一张图片：

1. **平坦区域**（比如蓝天）：左边像素是 100，右边也是 100。运算结果：`-100 + 100 = 0`。**结果为黑**，表示无边缘。
2. **边缘区域**（黑白交界）：左边像素是 0（黑），右边是 100（白）。运算结果：`-0 + 100 = 100`。**结果为亮**，边缘被提取出来了！

**结论：** 模糊是求和（保留低频），边缘检测是求差（保留高频）。它们是硬币的两面，就像微积分在一起。

如果把它们合二为一，就是[PID控制！](https://eliottwiener.github.io/pidcontroldemo/) 这和Kalman滤波（轨迹预测/motion追踪）也有一定联系。

- P，当下错多少，就马上补多少。定速巡航（上坡和过快工况）非常适合PID算法
- 没有 I：系统就像一个记性不好的愣头青，虽然在动，但总差那么一点点对不齐（静态误差）。
- 没有 D：系统就像一个反应迟钝的胖子，看到目标才刹车，结果因为惯性冲过了头（震荡）。

### 6.2 灰度与模糊：万变不离其宗的“加权”

既然说到了核，我们不妨把格局打开。你会发现，图像处理中看似完全不同的操作，本质上全是**加权求和**，仅仅是 **窗口（Window）和权重（Weight）** 不同而已。

* **高斯模糊**：
  * **窗口**：3x3 或 5x5 的空间邻域。
  * **权重**：中间高，四周低。
  * **目的**：融合空间信息。


* **边缘检测 (Sobel)**：
  * **窗口**：3x3 邻域。
  * **权重**：一边正，一边负。
  * **目的**：提取差异信息。


* **灰度化 (Luminance)**：
  * **窗口**：1x1 的像素点（但在 RGB, Nx3深度的方向上）。
  * **目的**：融合通道信息——人眼对绿色最敏感，所以绿色的权重最大，图片被压绿。
  * **权重**： `lum=rgb@ [0.299, 0.587, 0.1, 14], np.sum(rgb * [0.299, 0.587, 0.114], axis=-1)`


计算机视觉的底层，就是无数个这样的“加权求和”机在疯狂运转。

### 6.3 卷积神经网络 (CNN)：让机器自己“磨”镜片

在 2012 年深度学习爆发之前，科学家们需要手工设计这些核：“这个核用来找垂直边缘”、“那个核用来找圆形斑点”，硬编码边界条件。这被称为“手工特征工程”。

`(if (has_wings x) (is_bird x))` ，所以两足无羽毛的“动物”是人，所以落汤鸡是人！这和芝诺的悖论一样扯穿了皇帝新装。

后来，**卷积神经网络 (CNN，1989，法国人Yann LeCun)** 出现了。它的逻辑发生了革命性的逆转：

**“我不再告诉计算机用什么核，我只给它看照片和答案（比如‘这是一只猫’），让计算机通过反向传播，自己去‘磨’出它需要的镜片（核）。”**

令人起鸡皮疙瘩的是，当我们打开训练好的 AI 模型（如 VGG16 或 ResNet）的**第一层**，看看它自动学到了什么核时，我们会发现：**它学到的几乎全是窗口不同的高斯模糊核和 Sobel 边缘检测核！**

这证明了无论是人类数学家推导出来的公式，还是 AI 暴力计算出来的最优解，**“平滑”与“求导”确实是理解视觉世界的基石。**

- 面对声音和图像的任务，TTS, ASR, OCR等分类器, 人脸2vec
- 超分辨率, 补帧, 风格化（掉色修复等）
- Demix音乐, SAM, 前景提取、AI橡皮擦
- 真正的GenAI，从图片或原声（嵌入vec）生成

> 最开始的ANN（感知机）是从AND/OR，XOR这样的划分开始的。1 XOR 1 -> 0 无法被函数线(loss)划分， 但通过添加1个层（非二维空间+非线性loss），连更多层次与采样点（神经元），前馈全连接网络可以实现Iris分类等简单任务。

人能调的超参数其实很少。设计DNN应用不需要理解这些知识（实际上它们已经离现代Nets很远了），只要AI编程工具、算力和数据集。

现代MLer的工程力，连cpu/gpu的开关和CLI解析都做不好，代码只是勉强能跑，却可以搞定，就足以说明他们和编程没太大关系。DNN的超参数，包括ONNX定义的那些流图，都是LLM就有能力生成的，往往大同小异。

### 6.4 多尺度感知 (U2Net)与视觉皮层

![](https://survivor.togaware.com/mlhub/graphics/u2net_cutout_girl1.png)

最后，让我们聊聊像 **U2Net**（一种前景物，或者说显著结构性抠图算法）这种现代，B站都在用的架构。它们引入了一个更高级的概念：**多尺度（Multi-scale）与感受野（Receptive Field）**。

人类的视觉皮层不是单层运作的。

* **V1 区（初级视觉皮层）**：只看极小的局部，负责提取边缘（类似我们教程里的 Sobel）。
* **V2/V4 区**：将边缘组合成形状（圆形、方形）。
* **IT 区（高级视觉皮层）**：将形状组合成语义（“这是一张人脸”）。

**这本质上是对“卷积核大小”的极致运用。**

在 CNN 中，为了模拟这个过程：

1. **浅层网络**：使用小卷积核，分辨率高，看到的是“毛发的边缘”。
2. **深层网络**：通过 **池化（Pooling）** 或大步长卷积，图像被缩小了（Downsampling）。此时，一个 3x3 的核在小图上扫过，实际上覆盖了原图中很大的一片区域。它不再看“边缘”，而是看“结构”，tensor。就像ShaderToy里的BufferA保存和迭代的“伪2D图像”。

传统的 U-Net 只是在“下楼”和“上楼”之间架了几座桥（Skip Connections），边缘往往会变“肉”（由于深层语义和浅层细节的对冲不够精准）

**U2Net 的魔法**在于，它通过一种叫做“U型结构”的设计，同时保留了：

* **深层的宏观视野**（模糊的大概轮廓）：知道“这里有个人”。
* **浅层的微观细节**（锐利的边缘）：知道“头发丝怎么抠”。

它将不同“缩放级别”的信息融合在一起（Feature Fusion），就像在你那个交互组件里，**同时**使用了一个超大的 Sigma（看大概）和一个超小的 Sigma（看细节）。

是“重塑信息”。它在不同的尺度（Scale）上进行投影，最后再通过 Skip Connection 把这些信息“缝合”在一起。

就像你在PS里选中一个人，再用边缘羽化解决她的头发。

### 第二节：高斯核 (The Gaussian Kernel)

**核心概念**：加权平均，中心权重最高。
**通俗隐喻**：👓 **近视眼看路灯 (Myopia / Bokeh)**

> **“为什么在近视眼眼中，远处的路灯是一个光斑，而不是一个点？”**
> 当你摘下眼镜，盯着远处的一个LED灯（单个像素的脉冲信号）：
> * 原本锐利的一个光点，在视网膜上散开成了一个模糊的圆球。
> * **中间最亮，边缘逐渐变暗** —— 这就是天然的**高斯分布**。
> 
> 
> 所谓的“卷积”，就是把整个世界看作是由无数个小光点（高斯椭球/3DGS）组成的。如果你带着“高斯核”这副近视眼镜去看世界，每一个点都晕染开了，光与光之间互相交融，世界自然就变得模糊（平滑）了。

### 第三节：采样定理与混叠 (Sampling & Aliasing)

**核心概念**：香农定理，频率超过采样率一半会发生错误。
**通俗隐喻**：🎡 **电风扇与倒转的车轮 (The Wagon-wheel Effect)**

> **“为什么电影里的直升机螺旋桨看起来像是静止的？”**
> * **现实 (高频信号)**：螺旋桨每秒转 24 圈。
> * **采样 (Sample Rate)**：摄像机每秒拍 24 张照片。
> 
> 
> 第一张照片，桨叶在 12点钟方向；第二张照片，桨叶刚好转了一整圈又回到了 12点钟方向。
> 结果在摄像机（计算机）眼里，这个桨叶从来没动过！这就是**混叠** —— 高频的动态被错误地“伪装”成了静止（低频）。

> 正如你的日常体验，**摩尔纹**也是一样：当两层纱窗网眼的密度（频率）相互干扰时，肉眼（低通滤波器）就会看到原本不存在的奇怪波纹。
> **采样定理就是一条铁律：想抓拍赛车，你的快门必须比车轮转速快两倍。**

| **底层波形** | 空气压力波 (纵波) | 电磁波 (横波) |
| **物理频率** | 低 (Hz/kHz) | 极高 (THz) |

### 第四节：FFT (快速傅里叶变换)

[快来看音乐.mp3里的每个细节（盯帧）！](https://chiptune.app/browse/Demo%20MIDI/Voyetra%20Orchestrator/) （需点击 Visualizer On）

[实现wav2png，可P图！](https://t.me/dsuse/18956)


**核心概念**：时域转频域，把复杂信号拆解成正弦波。
**通俗隐喻**：🌈 **三棱镜与 smoothie**

> **“如果给你一杯打碎的混合果汁（时域信号），你能尝出里面放了几个草莓、几块芒果吗？很难。”**
> 但如果有一个魔法机器，能把这杯果汁瞬间还原成整整齐齐摆在桌上的一堆水果（频域信号）：
> * 左边一堆是草莓（高频分量）。
> * 右边一堆是芒果（低频分量）。
> 
> 
> 这时候，如果你想“去除酸味”（降噪/低通滤波），你只需要把那堆“黄色果”拿走，再把剩下的水果重新打成汁（逆变换 iFFT）。
> **FFT 就是那个把混合果汁还原成水果阵列的三棱镜。** 在时域里极其痛苦的卷积运算，在频域里只是简单的“挑水果”。

如果你只做幅度谱（只有水果堆），而丢掉了相位谱（顺序），你再把它们打成汁时，味道可能完全不对——就像把餐后甜点变成了餐前开胃菜。

以下是一个完整的beep命令电音合成App，可在Colab上播放【第四节末尾】的GH音乐库。

```py
#@title 🎵 三段式 Beep 合成器 { display-mode: "form" }
input_data = "" #@param {type:"string"}
DT_MIN = 0 # @param {"type":"slider","min":0,"max":1000,"step":1}
import numpy as np
import re, math
from IPython.display import Audio

SEC = 1000
sr = 44100  # 44.1k 普通音质，MIDI播放器
hz2key = lambda f: np.where(f > 0, 12 * np.log2(np.maximum(f, 1e-9) / 440) + 69, -1)

# 数据流重塑：正则分块 -> 字典化 -> 生成 (音符/休止符) -> 过滤压扁
chunks = [dict(re.findall(r'-([lfDr])\s+([\d.]+)', c)) for c in re.split(r'[-–]+(?>new|n)', input_data)]
# 矩阵 (N, 4)，统一交由 NumPy 做批量 float 转换
# 1. 每行包含：[频率, 时长, 0Hz, 延迟时长]
try:
  raw = np.array([[d.get('f', 440), d.get('l', 0), 0, d.get('D', DT_MIN)] for d in chunks], dtype=float).reshape(-1, 2)
  hz, ms = raw[raw[:, 1] > 0].T
except "看不懂":
  hz, ms = np.array([
      (f, ms)
      # 用正则精准抓取参数对并转为字典（屏蔽了参数乱序的问题）
      for d in chunks
      # 如果 ms <= 0（比如没有 -D），不加0Hz结束符
      for f, ms in [(float(d.get('f', 440)), float(d.get('l', 0))), (DT_MIN, float(d.get('D', 0)))] if ms > 0
  ]).T

import pandas as pd, plotly.express as px
# 2. 一行流绘图：动态计算 MIDI 键号作为 Y 轴，Hz 作为颜色
d = ms / SEC
df = pd.DataFrame({'T0': np.cumsum(d)-d+1, 'T1': d, 'Hz': hz})[hz > 0]

px.bar(df, base='T0', x='T1', y=12*np.log2(df.Hz/440)+69, color='Hz', orientation='h')\
.update_layout(plot_bgcolor='#232323', paper_bgcolor='#333',font_color='wheat',).show()

mid_keyons = hz2key(hz)
if not input_data:
  mid_keyons = np.array([60, 62, 64, 65, 67, 69, 71, 72]) 
  ms = np.array([400] * 8) # .4s repeat-x

# 3. 频率映射 key2hz (无循环)
hz = 440 * (2 ** ((mid_keyons - 69) / 12))

# “频率流”,将 [392, 0, 440] 扩展为 [392, 392... (持续counts[0]个), 0, 0... , 440, 440...]
sepAxe = (ms * sr / SEC).astype(int)

# 频率转相位：np.cumsum 替代了所有关于时间的 for 循环和 i*t 计算
# 即使频率瞬间跌落到 0Hz，相位也会停留在当前位置不跳变
phase = np.cumsum(math.tau * np.repeat(hz, sepAxe) / sr)

display(Audio(np.sin(phase), rate=sr))
```

### 第五节：边缘检测 (Edge Detection)

**核心概念**：求导，寻找突变点。
**通俗隐喻**：🦯 **盲人的导数手杖 (The Blind Man's dy/dx Cane)**

> **“如果你闭上眼睛走在人行道上，如何知道哪里是马路牙子（边缘）？”**
> 你会用手杖不停地敲击地面：
> * 地面平坦时（信号无变化）：手杖反馈的高度差是 0。
> * 遇到台阶时（信号突变）：手杖会突然落空或被绊住，高度差瞬间变成 10cm。
> 
> 
> Sobel 算子就是这根手杖。它不关心绝对高度（是高山还是平地），它只关心 **“刚才和现在，有没有落差”**。
> * **平滑**是把山峰削平。
> * **边缘检测**是把悬崖标红。

### 第六节：卷积神经网络 (CNN)

**核心概念**：自动学习特征核，多尺度感知。
**通俗隐喻**：🔑 **配钥匙师傅 (The Locksmith)**

> **“以前的算法（手工特征），是我们拿着尺子去量锁芯，然后画图纸磨钥匙。现在的 AI 是什么？”**
> AI 是一个完全不懂锁的学徒，但他手里有一百万把空白钥匙（随机初始化的核）。
> * 他把钥匙插进锁孔（卷积）。
> * 拧不动（testset预测错误，Loss大）。
> * 于是他拿挫刀稍微磨一下钥匙齿（反向传播，更新权重）。
> * 重复一亿次。
> 
> 
> 最终，他磨出了一把奇形怪状的钥匙，虽然他不知道为什么长这样，但这把钥匙，完美打开这扇门。
> 打开第一道门（第一层）的钥匙，通常长得像**Sobel算子**；打开最后一道门（最后一层）的钥匙，长得像**猫的耳朵**。
> **CNN 不是在看图，而是在无数次试错中，磨出了开启视觉密码的万能钥匙。**

在DNN的内核里，从tensor公式自动得出导函数（ `def forward(x), auto def reverse(x,y)->delta` ），通过梯度下降最优化Loss函数（或者说任务函数）的可微编程语言正成为一个和元编程reflect一样有意义的概念。 Taichi的物理模拟也需要连续可导

元编程允许程序观察自己的API和样板代码，但它无法告诉程序“如何变得更好”。 可微编程赋予了程序一个目标函数来拟合（Objective Function）。只要程序是可微的，它就能沿着梯度的方向自动进化。

与逻辑式编程（SQL/SWI-Prolog/Lean）不同，可微编程不会用“真假”(A==B)，它总是给出距离允许你去求真(A-B)。 `Unit?` 的结构信息量依旧比纯 `Boolean` 高太多了。原谅优于请求。

## 第三节的尾巴：看不见的墙 —— 采样定理与混叠 (Aliasing)

### 3.2 实验：消失的方波与幽灵噪音

请到你家的实验室，进行两个破坏性实验：

**实验 A：低音炮播小提琴（低通滤波）**

1. 选择 **"Square (方波)"**。
2. 将 `Freq` (鼠标Y) 拉到最高，移到最左。
3. 将 `Kernel Size` (鼠标X) 拉到最右边（极大）。

* **现象**：方波先是变成了圆润的正弦波，随着核继续变大，波幅越来越小，最后**彻底消失成一条直线**。
* **原理**：卷积核本质上是一个**低通滤波器**。核越宽，它的**截止频率**就越低。

这就像你试图用一个只能发低音的**低音炮**去播放尖锐的**小提琴**独奏。音响依然在震动，但因为它无法响应那么高的频率，结果就是一片死寂。

**实验 B：幽灵噪音（混叠）**

1. 如果你的浏览器允许，我们在代码里设定了 `sr:=sampleRate` (通常是 44.1kHz)。
2. 想象一下，如果我们生成的方波频率超过了 **22050Hz** (即 ear.sampleRate / 2)。

* **现象**：理论上你应当听不到声音（超声波），但实际上你会听到一种**奇怪的、低沉的金属杂音**。
* **原理**：这就是音频版的“车轮倒转”。计算机的采样点抓不住那么密的波峰，结果把高频波“看”成了低频波。

这个低频杂音原本并不存在，它是数学世界的幽灵，但在DAC芯片上存在。

### 3.3 44.1kHz 的秘密

为了避免这种幽灵噪音，香农（"Claude" Shannon）定下了一条铁律：**奈奎斯特采样定理**。他就在 Audacity 的菜单里。

符合了这条铁律，离散的柱形图就能变成“完美的连续线”。 ——数学公式可能骗你，但生产环境下的代码产品，不会！

> **要想完美还原宇宙里的一个信号，你的采样频率必须至少是该信号最高频率的 2 倍。**

* **人耳的极限**：我们能听到的最高频率大约是 **20kHz**。
* **数学的底线**：要捕捉 20kHz，采样率至少要 40k。
* **工程的妥协**：为了留点安全余量，CD 标准最终定在了 **44.1kHz**。

至于48k，是专业数字音频在标准化时（1980年代初），要和电影/电视帧率做整数倍关系（24fps、25fps、29.97/30fps），这样同步、剪辑、丢帧处理最干净。

**96kHz在最终听感上“真的有明显差异”吗？**

答案是：正常人听不出，或者差异极小、难以在盲测中区分；但在某些特定条件下（尤其是专业制作链路或极高品质滤波器），确实可能存在可察觉的细微改善。

听Hi-Res音乐 → 除非你有非常好的设备+训练有素的耳朵，否则96kHz 的“提升”多半是心理作用或高消费的母带版本的附赠品。绝大多数人，包括很多自称“金耳朵”的，最后都测不出差异。

胡言乱语： bit精度与数组广度间也存在着联系。现在的DNN常以广度换bit深度(ENOB)，和采样定理也有关系

bit 精度 ≈ 幅度（纵轴）量化分辨率  
宽度 ≈ 空间（横轴）采样密度
神经网络的“函数逼近”：低精度下单个基函数（神经元）很粗糙，就用很多粗糙基函数叠加来拟合精细函数。
很多高效推理框架（llama.cpp、bitsandbytes、gptq）观察到：4bit下宽模型（e.g. 70B → 120B）比窄深模型更稳，更大模型 + 4bit 优于更小模型 + 更高精度。

这和采样定理的“过采样补偿欠采样失真”高度类似：bit深度不够 → 用宽度过采样。

傅里叶变换的视角下，一个 4-bit 的方波是通过增加“谐波数量”（宽度）来无限逼近一个完美的正弦波，大规模带来的“统计稳定性”比纵轴深度更重要。

## 第四节：跨界魔法 —— 从 FFT 到整数乘法

### 4.1 为什么需要 FFT？

记得上面说过？ 要在二维图像上做一个复杂的高斯模糊，我们可以先横后纵？

在之前的代码中，我们用两层 `for` 循环做卷积，计算量是 n^2。当核很大时，CPU 会冒烟。
数学家发现了一个作弊码：**卷积定理**。

简单说：**“时域上的卷积” 等价于 “频域上的点乘”。**
与其在时域里把两个数组费劲地“卷”在一起，不如把它们都变成频谱，对应位置乘一下，再变回来。这把复杂度降到了 log2。 <FFTW.org> 实现了这些

复数和无理数PI都能从 sqrt() 推导出来，所以复数向量象征着计算的一个基础。“上帝公式”知道答案。

### 4.2 脑洞时刻：FFT 能算 13 x 21 吗？🤯

你可能会问：FFT 里面全是 `sin`、`cos` 和复数！这跟我们小学生的整数乘法，有半毛钱关系？

**关系大了。** 让我们看一个惊人的例子：计算 。

在计算机眼里，这不仅是数字，这是**多项式**。

*  可以看作向量 `[3, 1]` （代表 13）
*  可以看作向量 `[1, 2]` （代表 21，这是在致敬 isJvmByteOrder/大端?）

现在，让我们对这两个向量做**卷积（Convolution）**：

```text
向量 A: [3, 1]
向量 B: [1, 2]

卷积过程 (像竖式乘法一样错位相乘):
个位: 3 * 1 = 3
十位: 3 * 2 + 1 * 1 = 7
百位: 1 * 2 = 2

结果向量: [3, 7, 2]

```

解析结果：个十百(1e0~e2)，作为多项式，加权求和。
检查一下：273。**Bingo!**

如果不翻转 B，直接让 B 在 A 上滑动，求点积 = 3×1+1×2=5。没有实现错位相乘的语义！

之所以要flip，只是为了消两个seq之间的回音。先到的（低位）和后到的（高位）不能乱，要对冲

```
    1 3  (A: 大端序)
  x 2 1  (B: 先算这行，右往左)
  ------
    1 3  (1 * 13时)
  2 6    (2 * 13时)
  ------
  2 7 3

先算B行是省得你翻转273这个结果。2维思考！行列式hacker！
```

其实真正涉及到卷积的翻转问题的几乎绝迹了，我这里只是为了用而用（十进制交换律），让你们看看真正懂翻转的人怎么嘲笑它。

就连标准的 RNN 也不需要卷积那种“数学翻转”，但在 Seq2Seq 的早期历史上，人们发现“手动翻转输入序列”(early BiRNN)是一个神级 Trick，因为能让头尾单词衔接（“成语接龙”）的更快。BERT的“完形填空”终结了顺序问题，它注意整个上下文。

### 4.3 整数和浮点有什么关系吗？

这一刻，请把你的思维打通：

1. **钢琴键与响度**：FFT 把信号分解为一组 `sin/cos` 的和（实际上是能量+角度坐标的和，vocoder可以还原角度的部分。去看3b1b的FFT视频）。
2. **十进制计数**：我们平时写的数字，本质上是把数量分解为一组 `10的幂` 的和，有些人美其名曰【正交基】，总之这些维度不耦合！不会像2D Desmos.com 图 = 1D灰度图一样（1个x不可能显示有2个y！）


**看见了吗？它们在数学结构上是完全一样的！**

* 我们在做信号处理时，基底是频率。
* 我们在做整数乘法时，基底是进制。
* 就像我们处理“线条”与“图片”坐标系时，高斯模糊kernel的形状是完全一样的，只是像折纸一样立起来了！

[Jezzamon 的可视化精准的传达了这种直觉！](https://www.jezzamon.com/fourier/zh-cn.html)

读读【正交基】后的那段话，读读上面提过的地形生成。从“函数线”到MC的地形，也有同构性。

总而言之，我们完全可以用 Python 里的 FFT 库来做乘法：

```python
# 定义两个数字的系数（个位在前）
# 13 -> 3 + 10
# 21 -> 1 + 20
a = [3, 1, 0, 0] # 补0是为了防止循环卷积溢出
b = [1, 2, 0, 0]

# 魔法发生：时域卷积 = 频域点乘
fft_a = np.fft.fft(a)
fft_b = np.fft.fft(b)
result_spectrum = fft_a * fft_b

# 变回时域，取实部
c = np.fft.ifft(result_spectrum).real
print(np.round(c).astype(int)[:3]) 

# 输出: [3 7 2]  ->  卷积后整体翻转，即 273

```

你刚刚发明了NTT。但在[十进制]整数里，我们需要做一个 "Ripple Carry"（涟漪进位） 的后处理，把能量收束回 0-9 的radix=10基底中。此处理窗口大小只需2。

这并不稀奇，[hex与base64就以radix=16,64](https://t.me/dsuse/18158) 保存相同的信号，比如比特币地址。

#### 二倍速与挂电的幕后

打开老的视频软件，里面没有二倍速播放，现在的芒果台修音，对高音依然会“挂电”，这背后的原因都在频域。

如果不使用 DSP 算法，仅仅是“把采样读得快一点”（Resampling）：频率 (Frequency)：波形被物理压缩了，频率变成了 2 倍（高八度）。你的声音会变成“花栗鼠”或“吸氦气”的声音。

> 我们都以为变调只是非常简单的ft+add+ift，**而变调软件的稀少，是因为这样（学院派）质量不够！**

这种代码写出来只要 10 行(wav2png反向)，但它的效果只能用来做 “搞怪电话变声器” 或 “恐怖片音效”。

“电”的本质：Auto-Tune 的核心参数是 Retune Speed。如果设为 0（最快），它会强制频率像楼梯一样跳变。

方波状的频率变化，在自然界中是不存在的，人耳一听就判定：“这是机器人”。

3Blue1Brown 视频里涉及的深水区，Phase Vocoder（相位声码器）：这是 Vocoder 的进阶版，主要用于时间拉伸（Time Stretching）和变调（Pitch Shifting），而不只能做机器人声效。

>变调需要 STFT (短时傅里叶变换)：把声音切片，算出每一片的能量和相位。
Magnitude (能量/响度)：告诉我们要弹哪个键，用多大力。
Phase (相位角/时间)：**告诉我们时间片窗口内，是什么时候按下这个键。**

如果你丢弃相位（只看能量），信号的“形状”就毁了。就像你把一张人脸照片做 FFT，只保留亮度频率，丢掉相位，还原回来就是一团云雾。这与“海森堡测不准原理”在音频里的诅咒（想听清低音，就看不清时间）完美搭配

Phase Vocoder 的工作就是去计算每一片花纹的“角度差”，然后旋转复数向量，把正弦波强行“接缝处理”，让它们在拉开距离后也依然能完美首尾相接。否则“角度差”会导致声音听起来像是在巨大的山洞里。

在完整 FT 里，如果你想让声音变长 2 倍，你唯一能做的就是把所有频率的周期都拉长。结果： 声音变长了，但音调也下降了（就像慢放磁带）。或许你洞察到了，**Vocoder处理的好像是缩图/超分辨时的采样率问题，有简陋的“Biqubic插值”方法。**

- [Torchaudio: 现实世界的TTS引擎](https://docs.pytorch.org/audio/stable/tutorials/tacotron2_pipeline_tutorial.html#sphx-glr-tutorials-tacotron2-pipeline-tutorial-py)
- [GriffinLim实现原理](https://colab.research.google.com/github/Speech-Interaction-Technology-Aalto-U/itsp/blob/master/Modelling/griffinlim.ipynb#scrollTo=f7b1d99e-f3ad-4ef9-bb85-06d17ce7ff52)

>对于简单的变调，只有两种实际算法。

Chrome在使用WSOLA把时间切碎，拉长，再平滑的拼回去(Find "Best Match" To avoid 破音) 以实现实时性，而 Melodyne 使用基于频域的 (time) Pitch-Shift OverLap-Add 。

并不是越“数学”算法效果就越好。基于优雅频域（低通滤波cos）的JPEG在绝大部分非实拍图上，空间效率反而不如zlib(QKV)字典信息学的PNG，这就像qsort优美，但TimSort才是默认一样。最后我会以HMM与Viterbi动态规划之死佐证数学迷信的失败。

Demucs 其实就是一个超级复杂的、非线性的CNN（U2Net变体），并非序列RNN，也不像Vocoder那样“在显微镜下拼贴”。

再多说些：Demucs用来隔离人声的算法，平替了Melodyne硬编码的Formant“高动态”算法！

然而Melodyne的高音依然有问题，这就是修音领域的 “恐怖谷效应” (Uncanny Valley)。

现在的 RVC / Sovits (AI 变声) 为什么高音不电，只会糊？ 因为它们不再是“修音”了，它们是 “重绘”，有随机种子在干涉（LLM Temperature）。

| 阶段 | 底层认知 (What is Sound?) | 数学本质 | 解决手段 |
| --- | --- | --- | --- |
| **硬编码 (DSP)** | 正弦波叠加 (Signal) | 傅里叶变换 | **保真 (Fidelity)**：尽量不破坏原始数据 |
| **E2E (Demucs,Formant)** | 结构特征 (Feature) | 卷积/潜空间流形学习 | **区分 (Discrimination)**：寻找最佳分割线 |
| **SD/NTP (GenAI)** | **信息熵 (Information)** | 概率分布/贝叶斯 | **合理 (Plausibility)**：只要听着像真的，就是真的 |

**一句话总结：**
从“**必须忠实于输入**（导致无法处理高频稀疏）”，变成了“**只要忠实于先验知识，输入是可以被抛弃的**”。

人耳对相位的突变（破音/Click）极其敏感，但对局部的波形重复相对迟钝！（迷彩服就是那样）

正弦波是死板的数学定义，它不懂什么是“沙哑”，什么是“爆破音”。当你试图改变它时，你必须小心翼翼地维护相位的连续性，拿着原始的砖头（采样），试图把它们砌成一个新的形状，否则物理世界就会惩罚你（出现人机音色）。

> 频域能尽量不破坏原始数据？ 可是哪怕做mp3压缩，哪怕做降调，也不会只改变STFT里key的能量，相位也会被破坏！

所以TPU机器不再是修补匠，它变成了造物主。它意识到：**重要的不是保留那个破损的波形，而是保留那个波形原本想传达的“意图”。**

它听到的不是 440Hz，而是 `[User: Female, Pitch: A4, Emotion: Sad, Texture: Breathy]`。这就是为什么 AI 变声的高音不“电”。

#### DSPer吐槽

以上的资料…… 中文圈就连讲到STFT的层次都少的可怜，多数既浅尝辄止，又过度复杂，知乎上更是一地碎片，更别说把相位作为一等公民，原理上对标生产环境软件了（Rubber Band 或 SoundTouch）。

中文圈绝大多数资料只教你 `np.abs(fft(x))` 画个语谱图（Spectrogram）就结束了。学院派？呵呵。

SASP书，这些东西并没有真正像我们刚刚那样的重视原理。 ——我要的只是简简单单的调音，不是从傻瓜开始学起！！

我就像这样学DSP：

其实 “早期 Image AI Erasure”（通常指 Photoshop 早期版本的 Content-Aware Fill 或者说 PatchMatch 算法），

它和音频里的 SOLA (Overlap-Add)，本质上都是 **“为了让发完一副牌的时间不变，你每发几张牌，就从手里偷摸再拿回几张重新发一遍”**。

正因为这种“盲目搬运”太容易出错，两个领域的进化路线也是惊人的同步：

* **阶段 1：硬算 (Heuristic)**
  * **音频**：寻找“过零点”或“相关性峰值”来拼接，试图减少咔哒声（WSOLA）。
  * **图像**：寻找“纹理梯度”最小的方向来拼接，试图减少接缝感（Image Quilting）。
  * *结果：路人消除能用，但经常穿帮。* 本来该复制“天空”(背景)，结果不小心复制了旁边的“人头”(前景)。你会看到天空里长出了半个脑袋。


* **阶段 2：统计 (Statistics)**
  * **音频**：把声音拆成正弦波，只保留统计特征（Phase Vocoder / Spectral Modeling）。
  * **图像**：把图像拆成小波变换，做纹理合成。
  * *结果：平滑了，但糊成一团。*


* **阶段 3：语义 (Deep Learning / Latent)**
  * **音频 (Demucs/RVC)**：AI 知道“这是人声，那是鼓点”，所以变调时绝对不会混淆。
  * **图像 (Stable Diffusion Inpainting)**：AI 知道“这是狗，那是山”，所以填补时它会**重绘**一座山的灵魂，而不是复制一只耳朵的尸块。

但它们也是共存的。就像PS当年的 Seam Carving (局部近视) vs 今天B站弹幕现在会用它防挡的 U2Net (全局与细节并存) vs 更早期的用色度键（Green Screen）或边缘检测，在OBS里依然有用绿幕。

如果连CPU上看色度键和梯度/边缘的算法都不懂，就开始学热门的sd，这其实不是DSPer的路线。

Stable Diffusion 最强大的插件 ControlNet，其核心输入是什么？Canny。 如果你不懂 sobel 算子，不懂梯度计算，你就无法理解为什么 Canny 需要双阈值，你也无法优化 ControlNet 的输入，导致生成的图线条断裂。

> AI 是画笔，传统 DSP 是画笔的“草稿”。

传统DSP还是有意义的。很多人以为 Chroma Key 只是 if pixel == green then alpha = 0 ，可好莱坞用的 Keylight 或 OBS 的算法都基于hsl()或YUV，单纯易懂的rgb在图像流处理的场景下是灾难。 

……所以我们已经走的离知乎太远了，我们知道现实世界的采样声库、鬼畜为什么挂电，为什么早期AI声库动态表现力不行，而有些SVC声库经常像吐痰/发糊，
为什么NewTone这类软件相比于简单的EQ/visualizer这么稀少，以及它们离DSP、DNN技术有多近！

我们什么算法也没写，却也触碰了很多东西。

胡言乱语：或许有些算法很复杂，但在我看来，复杂的东西未必是好的。

比如训练HMM的图算法就莫名的复杂（一种EM，需要在那张节点图上反复“前向-后向”倒腾），在DNN时代大家都用LSTM或sd，没人在意它了！

在工程领域，Simple constraints enabling complex behaviors (简单规则“涌现”复杂行为) 才是终极的“最优解”。

HMM 的状态图与平均方差就像 “地平说”：它假设语音生成是一个线性的、离散的马尔可夫链（几何UI的可解释性）。这是一个完美但错误的核心假设。

当它发现这个模型拟合不了真实的语音（行星轨迹不对）时，它没有怀疑核心假设，而是开始加补丁。

最终，工程师们沉迷于“通过精妙的数学（高斯混合模型 GMM）来修补一个错误的圆”，却忘记了也许轨道本身就是椭圆的（非线性/深度学习）

**盲目相信几何的可解释性，实际上是一种智力懒惰。 只是因为 HMM 的圆圈和箭头（状态转移图）画在白板上很好看，很符合人类直觉——这就像试图用物理层的电压波动，来解释大脑皮层的“爱”。**

这就导致你控制了一堆电压数据，但你依然不知道怎么调整代码能让体验感更好，而 Embedding（嵌入向量）却不需要知道哪些神经元亮了，只是发现在 高维向量空间（Latent Space） 中，“爱”的向量和“愉悦”的向量夹角很小。

天文学家托勒密为了维护“圆”的神圣性，在圆上加圆；工程师为了维护“马尔可夫链”的可解释性，在状态上加高斯分布。是智力上的懒惰——图、圆、状态跳转，是正确但废话地解释只能让大脑感受的高维现实（语音流、语义场）

在编程语言理论上，这就像固执的用 Dataflow chart 表达一切代码，却不懂得用强大的for/if或 CSS :hov/{var} 来约束那些连线。这还不如用 嵌入向量/精调/RLHF/GAN 这些“暗号”，一切交给算力。

在嵌入与潜空间中，"性别"可能是一个轴，"尊卑"是另一个轴，修改性别不需要重写尊卑的逻辑，它们是数学上解耦的。
HMM 这种离散图结构，一切耦合在一起（一个状态既包含了音素信息，又隐含了时长信息），一旦跳错一个节点，整个链路就断了，就像CV的硬编码tag。 

这就是“优雅性”对技术的决定性先验。

### 4.4 最后的小彩蛋

虽然 FFT 用到了复数和三角函数，但那只是为了构建一个 **“正交的旋转空间”**，让数据变换过去再变回来不失真。

对于计算机来说，**Schönhage–Strassen 算法** 正是利用这个原理，通过 **NTT (数论变换，Number Theoretic Transform)** —— 一种在有限域整数上运行的“FFT”，来实现超大整数（比如几亿位的圆周率计算）的极速乘法，Python 的 `int()` 就包含它！

**所以，当你下次听到“卷积”这个词时，别只想到模糊的图片。无论是你耳机里的重低音，还是你银行卡里的余额数字，底层都在运行着同样的“加权求和”的宇宙法则。**

现代音频压缩和去噪的核心技术。 解决“海森堡测不准原理”在音频里的诅咒（想听清低音，就看不清时间）
小波变换 (Wavelet Transform) 是 FFT 的继任者，试图通过“可变大小的窗口”来打破这个诅咒。

<script>
document.getElementById('v').innerHTML = marked.parse(document.getElementById('md-data').textContent.replace(/^\s*<!\[CDATA\[|\]\]>\s*$/g, ''))


let doc = document,
    root = doc.getElementById('ui'),
    cv = doc.getElementById('cv'),
    sel = doc.getElementById('sel'),
    ctx = cv.getContext('2d', { alpha: false }),
    ac, // AudioContext
    
    // State
    w, h, t = 0,
    mx = 0.5, my = 0.5,
    type = 'sine',
    
    // Math Constants
    PI = Math.PI,
    KS = 60, KL = KS * 2 + 1,
    sig, res, k = new Float32Array(KL),
    lmx = -999,

    // Generators (Fixed: Using Floor to handle negative Phase safely)
    gen = {
      sine: (i, f, p) => Math.sin(i * f + p),
      square: (i, f, p) => Math.sin(i * f + p) > 0 ? 1 : -1,
      triangle: (i, f, p) => {
        let v = (i * f + p) / (2 * PI)
        return 2 * Math.abs(2 * (v - Math.floor(v + 0.5))) - 1
      },
      sawtooth: (i, f, p) => {
        let v = (i * f + p) / (2 * PI)
        return 2 * (v - Math.floor(v + 0.5))
      }
    },
    pluck = ({MA=true}={}) => {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)()
      let sr = ac.sampleRate,
          fr = 55 + my * 880,
          N = Math.floor(sr / fr),
          impulse = sr * 2,
          buf = ac.createBuffer(1, impulse, sr),
          d = buf.getChannelData(0),
          smooth = 0.01 + (mx * .3),
          alpha = 0.995,
          i = 0,
          // 1. Define Gen Props
          // w: Angular Freq (How much phase to advance per sample to fit 2PI in N)
          PI = Math.PI,
          w = 2 * PI / N, 
          g = gen[type] || gen.sawtooth,
          // 2. Dynamic Limit: Fill all if Tone, fill burst if String
          limit = MA ? N : impulse

    // Burst / Tone Gen
    // g() handles periodicity naturally via sin(i*w), no modulo needed
    for (; i < limit; i++) d[i] = g(i, w, 0)

    // Feedback (Karplus-Strong)
    // Only runs if MA=true. 'i' continues from N.
    if (MA) for (; i < impulse; i++) {
      d[i] = alpha * (d[i - N] * (1 - smooth) + (d[i - N + 1] || 0) * smooth)
    }

    let src = ac.createBufferSource()
    src.buffer = buf
    src.connect(ac.destination)
    src.start()
  }

resize = () => {
  let r = root.getBoundingClientRect()
  w = cv.width = r.width
  h = cv.height = r.height
  sig = new Float32Array(w)
  res = new Float32Array(w)
  lmx = -999
}
new ResizeObserver(resize).observe(root)

// Inputs
root.onmousemove = e => {
  let r = root.getBoundingClientRect()
  mx = (e.clientX - r.left) / w
  my = 1.0 - (e.clientY - r.top) / h // Y flipped for freq
  mx = mx < 0.01 ? 0.01 : (mx > 0.99 ? 0.99 : mx)
  my = my < 0.01 ? 0.01 : (my > 0.99 ? 0.99 : my)
}

root.onclick = () => { setTimeout(() => sel.focus(), 0); pluck({MA:true}) }
root.oncontextmenu= ev => { ev.preventDefault(); pluck({MA:false}) }
sel.onchange = e => { type = e.target.value }

loop = () => {
  let mxPx = mx * w,
      f = 0.05 + my * 0.3,
      amp = h / 5,
      fn = gen[type],
      i, j, acc, val, sum = 0

  // 1. Calc Kernel (Gaussian) only on delta
  if (Math.abs(mxPx - lmx) > 0.5) {
    lmx = mxPx
    let sigma = Math.max(1, mx * 20)
    for (i = 0; i < KL; i++) {
      val = Math.exp(-((i - KS) ** 2) / (2 * sigma ** 2))
      k[i] = val
      sum += val
    }
    for (i = 0; i < KL; i++) k[i] /= sum
  }

  // 2. Gen Signal
  for (i = 0; i < w; i++) sig[i] = fn(i, f, t) * amp

  // 3. Convolve
  for (i = 0; i < w; i++) {
    acc = 0
    let start = i < KS ? KS - i : 0,
        end = i + KS >= w ? w - i + KS : KL
    for (j = start; j < end; j++) acc += sig[i + j - KS] * k[j]
    res[i] = acc
  }

  // 4. Draw
  ctx.fillStyle = '#111'
  ctx.fillRect(0, 0, w, h)
  
  let draw = (arr, col, yOff) => {
    ctx.beginPath()
    ctx.strokeStyle = col
    ctx.lineWidth = 2
    for (i = 0; i < w; i += 2) ctx.lineTo(i, h / 2 + arr[i] + yOff)
    ctx.stroke()
  }

  draw(sig, '#444', -h / 5)
  draw(res, '#0f0', h / 5)

  // Visual Lens
  ctx.fillStyle = 'rgba(0,255,0,0.2)'
  let vy = (1.0 - my) * h,
      kMax = k[KS],
      xi = Math.floor(mx * w)
  for (i = 0; i < KL; i += 2) {
    let kh = (k[i] / kMax) * 40
    ctx.fillRect(xi + i - KS, vy - kh, 2, kh * 2)
  }

  t -= 0.15
  requestAnimationFrame(loop)
}

gen.noise = () => Math.random() * 2 - 1   // -1 ~ 1
gen.pulse = (i, f, p, duty = gen._d?? (gen._d=+prompt('PCM duty','0.5'))) => {
  const phase = (i * f + p) % (2 * Math.PI)
  const normalized = phase / (2 * Math.PI)   // 0~1
  return normalized < duty ? 1 : -1
}
// 拋物線波（很柔的類三角）
gen.parabola= (i, f, p) => {
  let v = ((i * f + p) / (Math.PI)) % 2
  v = v < 1 ? v : 2 - v
  return 4 * (v - 0.5) * (v - 0.5) - 1   // -1 ~ 1
}



// 簡單的指數上升鋸齒（攻擊更銳利）
gen.expSaw= (i, f, p) => {
  let v = (i * f + p) % (2 * Math.PI)
  return Math.pow(v / (2 * Math.PI), 1.5) * 2 - 1
}

gen.sampleHold = (i, f, p, hold = gen._h ?? (gen._h = +prompt('Sample & Hold steps (建議8~64)', '24') || 24)) => {
  // hold: 每多少個樣本更新一次取樣值（階梯寬度）
  // f 在這裡通常用來控制「取樣頻率」的感覺，但為了經典隨機風格，我們主要用 hold 控制
  const step = Math.floor(i / hold);
  
  // 最經典做法：用一個混亂的 hash-like 公式產生偽隨機值（可重現）
  // 或者直接 Math.random() 但每次播放都不一樣
  const seed = step * 12.9898 + p * 78.233;   // 經典 GLSL-style hash 種子
  const rand = Math.sin(seed) * 43758.5453;
  const value = (rand - Math.floor(rand)) * 2 - 1;   // -1 ~ 1

  return value;
};

gen.sampleHoldBig = (i, f, p) => {
  const hold = 16 + Math.floor(Math.random()*32);  // 隨機階梯寬度
  const step = Math.floor(i / hold);
  return Math.sin(step * 98765.4321 + p) * 2 - 1;
};

Object.keys(gen).forEach(key => sel.add(new Option(key, key)));


loop()
</script>
