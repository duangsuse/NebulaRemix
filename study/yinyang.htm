<body style=margin:0;overflow:hidden><canvas id=v></canvas>
<style>
  #v { position: absolute; top: 50%; left: 50%; margin: -300px 0 0 -300px; border-radius: 50%; box-shadow: 0 0 40px #fff3;
    animation: spin 5s linear infinite; filter: drop-shadow(4px 6px 15px cyan) }
  @keyframes spin { to { transform: rotate(360deg); } }

  body {white-space: pre; background: repeating-radial-gradient(circle at 50% 50%, gray 5%, #3b7751 var(--t), #23a552 20%, #db7097 21%);  cursor: alias;
    font-size: x-large;
    font-family: "Comic Sans MS";
    color: lightgreen;
    animation: breathe 4s cubic-bezier(0.18, 0.89, 0.57, 1.16) infinite alternate;}
    @keyframes breathe{0%{--t:12%} to{--t:18%}}
    @property --t {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
    }
</style>
<script type="module">
  import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';
  v.width = 600; v.height = 600;
  v.onclick=()=>{s.p^=1;update(); v.animate([{ filter: 'brightness(5)'},{ filter: 'brightness(1)'}], {duration:600,timingFunction:'cubic-bezier(0.22, 1, 0.3, 1)'})}

  let g = v.getContext('2d')
  let s = { p: 0.333, state: "", speed: 5 }, W = '#f5f5f5', B = '#1a1a1a';


  let update = () => {
    s.state = s.p > 0.98 ? "螺旋上升 (NOT Gate)" : s.p < 0.05 ? "质朴 (Singularity Gate)" : Math.abs(s.p - 0.333) < 0.02 ? "平衡 (1/3)" : `演化 (${s.p.toFixed(2)})`;
    Taiji(s.p);
  };

  let gui = new GUI({ title: 'Taiji 太极河图' });
  gui.add(s, 'p', 0, 1, 0.01).name('属灵占比').onChange(update);
  gui.add(s, 'state').name('混沌意形').disable().listen();
  gui.add(s, 'speed', 0, 60, 0.1).name('无极转速').onChange(val => v.style.animationDuration = val ? `${10/val}s` : '0s');


  let Taiji = (t_eye, R = 250, C = 300) => {
    let arc = (y, r, col, a1=0, a2=7) => (g.fillStyle=col, g.beginPath(), g.arc(C, y, r, a1, a2), g.fill());
    let eye = (y, c1, c2) => (arc(y, R/2, c1), arc(y, R/2*t_eye, c2));

    // 🌗 in 2C
    g.clearRect(0, 0, 600, 600); arc(C, R, W); arc(C, R, B, Math.PI/2, Math.PI*1.5);
    // ☯ 4 eyes one body: 4 circles vertical
    eye(C - R/2, B, W); eye(C + R/2, W, B);
  };
  update();
  document.body.append('  '+Taiji)
</script>
